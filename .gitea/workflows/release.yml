name: Harbor image

on:
  push:
    tags:
      - "v*"

jobs:
  docker:
    runs-on: ubuntu-24.04-htzhel1-ax42-a
    steps:
      - uses: https://gitea.obmondo.com/Obmondo/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: https://gitea.obmondo.com/Obmondo/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: docker/setup-qemu-action@v4.4.0
      - uses: https://gitea.obmondo.com/Obmondo/setup-buildx-action@v4.3.0

      - name: Log in to Harbor
        uses: https://gitea.obmondo.com/Obmondo/login-action@v4.6.0
        with:
          registry: harbor.obmondo.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Run GoReleaser
        uses: https://gitea.obmondo.com/Obmondo/goreleaser-action@v6.4.0
        with:
          version: v2.16.0
          args: release --clean -f .goreleaser-gitea.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
